<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ChatLink</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#07111f;
    --panel:#0d1b2a;
    --panel2:#12263a;
    --border:#20364d;
    --text:#f5f7fa;
    --muted:#91a4b8;
    --primary:#287cff;
    --primary2:#6c4cff;
    --sent:#1769e0;
    --received:#1b2d40;
    --danger:#ef4444;
    --online:#22c55e;
}

body.light{
    --bg:#eef3f8;
    --panel:#ffffff;
    --panel2:#f1f5f9;
    --border:#d8e0e8;
    --text:#152033;
    --muted:#66758a;
    --received:#e7edf4;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 10% 10%,#173c70 0,transparent 30%),
        radial-gradient(circle at 90% 90%,#39226e 0,transparent 30%),
        var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
}

/* APP */

.app{
    width:100%;
    height:100vh;
    display:flex;
    overflow:hidden;
}

/* SIDEBAR */

.sidebar{
    width:360px;
    min-width:300px;
    background:var(--panel);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
}

.brand{
    padding:20px;
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:1px solid var(--border);
}

.logo{
    width:45px;
    height:45px;
    border-radius:15px;
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:23px;
    box-shadow:0 8px 25px rgba(40,124,255,.3);
}

.brand h1{
    font-size:22px;
}

.brand span{
    color:var(--muted);
    font-size:12px;
}

.profile{
    padding:16px;
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:1px solid var(--border);
}

.avatar{
    width:46px;
    height:46px;
    border-radius:50%;
    background:linear-gradient(135deg,#287cff,#8b5cf6);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:bold;
}

.profile-info{
    flex:1;
}

.profile-name{
    font-weight:bold;
}

.profile-number{
    color:var(--muted);
    font-size:12px;
    margin-top:3px;
}

.icon-btn{
    width:38px;
    height:38px;
    border:0;
    border-radius:12px;
    background:var(--panel2);
    color:var(--text);
    cursor:pointer;
    font-size:17px;
}

.icon-btn:hover{
    background:var(--primary);
}

/* SEARCH */

.search{
    padding:12px;
}

.search input{
    width:100%;
    padding:13px 15px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
    border-radius:13px;
    outline:none;
}

/* CONTACTS */

.contacts-title{
    padding:10px 16px;
    color:var(--muted);
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1px;
}

.contact-list{
    flex:1;
    overflow-y:auto;
}

.contact{
    padding:13px 16px;
    display:flex;
    gap:12px;
    align-items:center;
    cursor:pointer;
    border-bottom:1px solid transparent;
}

.contact:hover,
.contact.active{
    background:var(--panel2);
}

.contact-avatar{
    width:48px;
    height:48px;
    border-radius:50%;
    background:linear-gradient(135deg,#14b8a6,#2563eb);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:20px;
}

.contact-info{
    flex:1;
    min-width:0;
}

.contact-name{
    font-weight:bold;
    margin-bottom:5px;
}

.last-message{
    color:var(--muted);
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.contact-time{
    color:var(--muted);
    font-size:10px;
}

/* MAIN CHAT */

.main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
}

.chat-header{
    height:76px;
    padding:14px 20px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:12px;
}

.chat-user{
    flex:1;
}

.chat-name{
    font-weight:bold;
    font-size:16px;
}

.chat-status{
    color:var(--online);
    font-size:12px;
    margin-top:4px;
}

.header-actions{
    display:flex;
    gap:7px;
}

/* MESSAGES */

.messages{
    flex:1;
    overflow-y:auto;
    padding:25px;
    display:flex;
    flex-direction:column;
    gap:10px;
    background-image:
        radial-gradient(circle at 20px 20px,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:40px 40px;
}

.date-label{
    align-self:center;
    background:var(--panel2);
    color:var(--muted);
    padding:6px 12px;
    border-radius:20px;
    font-size:11px;
    margin-bottom:8px;
}

.message{
    max-width:min(70%,550px);
    padding:10px 13px;
    border-radius:15px;
    line-height:1.45;
    font-size:14px;
    word-wrap:break-word;
    animation:appear .2s ease;
}

@keyframes appear{
    from{
        opacity:0;
        transform:translateY(5px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.received{
    align-self:flex-start;
    background:var(--received);
    border-bottom-left-radius:4px;
}

.sent{
    align-self:flex-end;
    background:var(--sent);
    border-bottom-right-radius:4px;
}

.message-time{
    display:inline-block;
    margin-left:9px;
    color:rgba(255,255,255,.55);
    font-size:9px;
}

/* COMPOSER */

.composer{
    padding:12px;
    background:var(--panel);
    border-top:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:8px;
}

.message-box{
    flex:1;
    position:relative;
}

.message-input{
    width:100%;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
    padding:13px 15px;
    border-radius:15px;
    outline:none;
}

.send-btn{
    width:48px;
    height:48px;
    border:0;
    border-radius:15px;
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    color:white;
    cursor:pointer;
    font-size:20px;
}

.send-btn:hover{
    transform:scale(1.04);
}

/* EMOJI */

.emoji-panel{
    position:absolute;
    bottom:65px;
    left:0;
    width:280px;
    padding:12px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:15px;
    display:none;
    box-shadow:0 15px 40px rgba(0,0,0,.4);
}

.emoji-panel.show{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:8px;
}

.emoji-panel button{
    border:0;
    background:transparent;
    cursor:pointer;
    font-size:21px;
}

/* ADD CONTACT */

.add-contact{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:20;
}

.add-card{
    width:92%;
    max-width:420px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:22px;
    padding:25px;
    box-shadow:0 25px 80px rgba(0,0,0,.5);
}

.add-card h2{
    margin-bottom:8px;
}

.add-card p{
    color:var(--muted);
    font-size:13px;
    margin-bottom:20px;
}

.field{
    margin-bottom:14px;
}

.field label{
    display:block;
    color:var(--muted);
    font-size:12px;
    margin-bottom:6px;
}

.field input,
.field select{
    width:100%;
    padding:13px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
    outline:none;
}

.phone-row{
    display:flex;
    gap:8px;
}

.phone-row select{
    width:43%;
}

.phone-row input{
    width:57%;
}

.modal-buttons{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.modal-buttons button{
    flex:1;
    padding:13px;
    border-radius:12px;
    border:0;
    cursor:pointer;
    font-weight:bold;
}

.cancel{
    background:var(--panel2);
    color:var(--text);
}

.save{
    background:var(--primary);
    color:white;
}

/* EMPTY */

.empty{
    margin:auto;
    text-align:center;
    color:var(--muted);
}

.empty-icon{
    font-size:55px;
    margin-bottom:12px;
}

/* MOBILE */

.mobile-menu{
    display:none;
}

@media(max-width:750px){

    .sidebar{
        width:100%;
        min-width:0;
    }

    .main{
        display:none;
    }

    .app.chat-mobile .sidebar{
        display:none;
    }

    .app.chat-mobile .main{
        display:flex;
    }

    .mobile-menu{
        display:block;
    }

    .message{
        max-width:85%;
    }
}

@media(min-width:751px){
    .mobile-menu{
        display:none;
    }
}
</style>
</head>

<body>

<div class="app" id="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="brand">
            <div class="logo">💬</div>

            <div>
                <h1>ChatLink</h1>
                <span>Mensajería sencilla</span>
            </div>
        </div>

        <div class="profile">

            <div class="avatar">TÚ</div>

            <div class="profile-info">
                <div class="profile-name" id="myName">
                    Mi cuenta
                </div>

                <div class="profile-number" id="myNumber">
                    Sin número
                </div>
            </div>

            <button class="icon-btn" onclick="toggleTheme()">
                🌙
            </button>

        </div>

        <div class="search">
            <input
                type="text"
                id="search"
                placeholder="🔎 Buscar chats..."
                oninput="searchContacts()"
            >
        </div>

        <div class="contacts-title">
            Conversaciones
        </div>

        <div class="contact-list" id="contactList">
        </div>

        <button
            onclick="openAddContact()"
            style="
            margin:14px;
            padding:14px;
            border:0;
            border-radius:14px;
            background:linear-gradient(135deg,#287cff,#6c4cff);
            color:white;
            font-weight:bold;
            cursor:pointer;">
            ＋ Agregar contacto
        </button>

    </aside>


    <!-- CHAT -->
    <main class="main">

        <div class="chat-header">

            <button
                class="icon-btn mobile-menu"
                onclick="backToContacts()">
                ←
            </button>

            <div class="contact-avatar" id="headerAvatar">
                👤
            </div>

            <div class="chat-user">

                <div class="chat-name" id="headerName">
                    Selecciona un chat
                </div>

                <div class="chat-status" id="headerStatus">
                    --
                </div>

            </div>

            <div class="header-actions">

                <button class="icon-btn" onclick="fakeCall()">
                    📞
                </button>

                <button class="icon-btn" onclick="fakeVideo()">
                    🎥
                </button>

                <button class="icon-btn" onclick="clearChat()">
                    🗑️
                </button>

            </div>

        </div>


        <div class="messages" id="messages">

            <div class="empty">
                <div class="empty-icon">💬</div>
                <h2>Bienvenido a ChatLink</h2>
                <p>Selecciona un contacto para comenzar.</p>
            </div>

        </div>


        <div class="composer">

            <button
                class="icon-btn"
                onclick="toggleEmoji()">
                😊
            </button>

            <div class="message-box">

                <div
                    class="emoji-panel"
                    id="emojiPanel">

                    <button onclick="addEmoji('😀')">😀</button>
                    <button onclick="addEmoji('😂')">😂</button>
                    <button onclick="addEmoji('😍')">😍</button>
                    <button onclick="addEmoji('🥰')">🥰</button>
                    <button onclick="addEmoji('😎')">😎</button>
                    <button onclick="addEmoji('😭')">😭</button>
                    <button onclick="addEmoji('😡')">😡</button>
                    <button onclick="addEmoji('❤️')">❤️</button>
                    <button onclick="addEmoji('🔥')">🔥</button>
                    <button onclick="addEmoji('👍')">👍</button>
                    <button onclick="addEmoji('👋')">👋</button>
                    <button onclick="addEmoji('🎉')">🎉</button>
                    <button onclick="addEmoji('🤣')">🤣</button>
                    <button onclick="addEmoji('🙏')">🙏</button>
                    <button onclick="addEmoji('💯')">💯</button>

                </div>

                <input
                    class="message-input"
                    id="messageInput"
                    placeholder="Escribe un mensaje..."
                    onkeydown="handleEnter(event)"
                >

            </div>

            <button
                class="send-btn"
                onclick="sendMessage()">
                ➤
            </button>

        </div>

    </main>

</div>


<!-- ADD CONTACT MODAL -->

<div class="add-contact" id="addModal">

    <div class="add-card">

        <h2>Agregar contacto 👤</h2>

        <p>
            Puedes utilizar números de diferentes países.
        </p>

        <div class="field">

            <label>Nombre</label>

            <input
                id="newName"
                placeholder="Ej: María"
            >

        </div>

        <div class="field">

            <label>Número de teléfono</label>

            <div class="phone-row">

                <select id="countryCode">

                    <option value="+57">🇨🇴 +57 Colombia</option>
                    <option value="+1">🇺🇸 +1 Estados Unidos</option>
                    <option value="+52">🇲🇽 +52 México</option>
                    <option value="+34">🇪🇸 +34 España</option>
                    <option value="+54">🇦🇷 +54 Argentina</option>
                    <option value="+56">🇨🇱 +56 Chile</option>
                    <option value="+51">🇵🇪 +51 Perú</option>
                    <option value="+58">🇻🇪 +58 Venezuela</option>
                    <option value="+593">🇪🇨 +593 Ecuador</option>
                    <option value="+591">🇧🇴 +591 Bolivia</option>
                    <option value="+55">🇧🇷 +55 Brasil</option>
                    <option value="+598">🇺🇾 +598 Uruguay</option>
                    <option value="+595">🇵🇾 +595 Paraguay</option>
                    <option value="+507">🇵🇦 +507 Panamá</option>
                    <option value="+506">🇨🇷 +506 Costa Rica</option>
                    <option value="+502">🇬🇹 +502 Guatemala</option>
                    <option value="+503">🇸🇻 +503 El Salvador</option>
                    <option value="+504">🇭🇳 +504 Honduras</option>
                    <option value="+505">🇳🇮 +505 Nicaragua</option>
                    <option value="+44">🇬🇧 +44 Reino Unido</option>
                    <option value="+33">🇫🇷 +33 Francia</option>
                    <option value="+49">🇩🇪 +49 Alemania</option>
                    <option value="+39">🇮🇹 +39 Italia</option>
                    <option value="+351">🇵🇹 +351 Portugal</option>
                    <option value="+81">🇯🇵 +81 Japón</option>
                    <option value="+82">🇰🇷 +82 Corea del Sur</option>
                    <option value="+86">🇨🇳 +86 China</option>
                    <option value="+91">🇮🇳 +91 India</option>
                    <option value="+61">🇦🇺 +61 Australia</option>
                    <option value="+7">🇷🇺 +7 Rusia</option>

                </select>

                <input
                    id="newNumber"
                    type="tel"
                    placeholder="3001234567"
                >

            </div>

        </div>

        <div class="modal-buttons">

            <button
                class="cancel"
                onclick="closeAddContact()">
                Cancelar
            </button>

            <button
                class="save"
                onclick="saveContact()">
                Agregar
            </button>

        </div>

    </div>

</div>


<script>

/* ================================
   CHATLINK
================================ */

let contacts =
    JSON.parse(localStorage.getItem("chatlink_contacts")) || [];

let chats =
    JSON.parse(localStorage.getItem("chatlink_chats")) || {};

let currentContact = null;


/* CUENTA */

let savedNumber =
    localStorage.getItem("chatlink_my_number");

if(!savedNumber){

    savedNumber =
        prompt(
            "Bienvenido a ChatLink. Escribe tu número con código de país:",
            "+57"
        );

    if(savedNumber){
        localStorage.setItem(
            "chatlink_my_number",
            savedNumber
        );
    }
}

document.getElementById("myNumber").textContent =
    savedNumber || "Sin número";


/* CONTACTOS */

function saveContact(){

    const name =
        document.getElementById("newName").value.trim();

    const code =
        document.getElementById("countryCode").value;

    const number =
        document.getElementById("newNumber").value.trim();

    if(!name || !number){

        alert("Completa el nombre y el número.");

        return;
    }

    const fullNumber =
        code + number;

    const contact = {

        id: Date.now(),

        name:name,

        number:fullNumber,

        avatar:name.charAt(0).toUpperCase()

    };

    contacts.push(contact);

    localStorage.setItem(
        "chatlink_contacts",
        JSON.stringify(contacts)
    );

    closeAddContact();

    renderContacts();

    openChat(contact.id);
}


/* MOSTRAR CONTACTOS */

function renderContacts(){

    const list =
        document.getElementById("contactList");

    list.innerHTML = "";

    contacts.forEach(contact => {

        const div =
            document.createElement("div");

        div.className =
            "contact" +
            (currentContact &&
            currentContact.id === contact.id
                ? " active"
                : "");

        div.onclick =
            () => openChat(contact.id);

        const chat =
            chats[contact.id] || [];

        const last =
            chat.length
                ? chat[chat.length - 1].text
                : "Nueva conversación";

        div.innerHTML = `

            <div class="contact-avatar">
                ${escapeHTML(contact.avatar)}
            </div>

            <div class="contact-info">

                <div class="contact-name">
                    ${escapeHTML(contact.name)}
                </div>

                <div class="last-message">
                    ${escapeHTML(last)}
                </div>

            </div>

            <div class="contact-time">
                ${chat.length ? chat[chat.length-1].time : ""}
            </div>
        `;

        list.appendChild(div);

    });
}


/* ABRIR CHAT */

function openChat(id){

    currentContact =
        contacts.find(c => c.id === id);

    if(!currentContact) return;

    document.getElementById("app")
        .classList.add("chat-mobile");

    document.getElementById("headerName")
        .textContent =
        currentContact.name;

    document.getElementById("headerAvatar")
        .textContent =
        currentContact.avatar;

    document.getElementById("headerStatus")
        .textContent =
        "● En línea";

    renderMessages();

    renderContacts();

}


/* MENSAJES */

function renderMessages(){

    const container =
        document.getElementById("messages");

    container.innerHTML = "";

    const date =
        document.createElement("div");

    date.className = "date-label";

    date.textContent =
        "Hoy";

    container.appendChild(date);

    const chat =
        chats[currentContact.id] || [];

    if(chat.length === 0){

        const welcome =
            document.createElement("div");

        welcome.className = "empty";

        welcome.innerHTML = `
            <div class="empty-icon">👋</div>
            <h3>Comienza la conversación</h3>
            <p>Escribe tu primer mensaje.</p>
        `;

        container.appendChild(welcome);

        return;
    }

    chat.forEach(message => {

        const div =
            document.createElement("div");

        div.className =
            "message " +
            (message.sent
                ? "sent"
                : "received");

        div.innerHTML =
            escapeHTML(message.text) +
            `<span class="message-time">
                ${message.time}
            </span>`;

        container.appendChild(div);

    });

    container.scrollTop =
        container.scrollHeight;
}


/* ENVIAR */

function sendMessage(){

    if(!currentContact){

        alert("Primero selecciona un contacto.");

        return;
    }

    const input =
        document.getElementById("messageInput");

    const text =
        input.value.trim();

    if(!text) return;

    if(!chats[currentContact.id])
        chats[currentContact.id] = [];

    const now =
        new Date();

    const time =
        now.toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    chats[currentContact.id].push({

        text:text,

        sent:true,

        time:time

    });

    localStorage.setItem(
        "chatlink_chats",
        JSON.stringify(chats)
    );

    input.value = "";

    renderMessages();

    renderContacts();

    /* DEMO: respuesta automática */

    setTimeout(() => {

        if(!currentContact) return;

        chats[currentContact.id].push({

            text:"Mensaje recibido 👍",

            sent:false,

            time:new Date().toLocaleTimeString(
                [],
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            )

        });

        localStorage.setItem(
            "chatlink_chats",
            JSON.stringify(chats)
        );

        renderMessages();

        renderContacts();

    },1200);

}


/* ENTER */

function handleEnter(event){

    if(event.key === "Enter"){

        event.preventDefault();

        sendMessage();

    }

}


/* EMOJIS */

function toggleEmoji(){

    document
        .getElementById("emojiPanel")
        .classList.toggle("show");

}

function addEmoji(emoji){

    const input =
        document.getElementById("messageInput");

    input.value += emoji;

    input.focus();

}


/* BUSCAR */

function searchContacts(){

    const query =
        document
        .getElementById("search")
        .value
        .toLowerCase();

    document
        .querySelectorAll(".contact")
        .forEach(element => {

            const text =
                element.textContent
                .toLowerCase();

            element.style.display =
                text.includes(query)
                    ? "flex"
                    : "none";

        });

}


/* TEMA */

function toggleTheme(){

    document.body.classList.toggle("light");

    localStorage.setItem(
        "chatlink_theme",
        document.body.classList.contains("light")
            ? "light"
            : "dark"
    );

}

if(
    localStorage.getItem("chatlink_theme")
    === "light"
){

    document.body.classList.add("light");

}


/* MODAL */

function openAddContact(){

    document
        .getElementById("addModal")
        .style.display = "flex";

}

function closeAddContact(){

    document
        .getElementById("addModal")
        .style.display = "none";

    document.getElementById("newName").value = "";

    document.getElementById("newNumber").value = "";

}


/* VOLVER EN CELULAR */

function backToContacts(){

    document
        .getElementById("app")
        .classList.remove("chat-mobile");

}


/* BORRAR CHAT */

function clearChat(){

    if(!currentContact) return;

    if(
        confirm(
            "¿Quieres borrar esta conversación?"
        )
    ){

        chats[currentContact.id] = [];

        localStorage.setItem(
            "chatlink_chats",
            JSON.stringify(chats)
        );

        renderMessages();

        renderContacts();

    }

}


/* LLAMADA DEMO */

function fakeCall(){

    if(!currentContact){

        alert("Selecciona un contacto.");

        return;
    }

    alert(
        "📞 La función de llamadas se conectará cuando añadamos el servidor."
    );

}


/* VIDEO DEMO */

function fakeVideo(){

    if(!currentContact){

        alert("Selecciona un contacto.");

        return;
    }

    alert(
        "🎥 La videollamada se conectará cuando añadamos el servidor."
    );

}


/* SEGURIDAD DEL TEXTO */

function escapeHTML(text){

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* INICIO */

renderContacts();

</script>
